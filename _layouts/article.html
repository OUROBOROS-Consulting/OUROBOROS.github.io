---
layout: default
---
{% assign hero_back_url = page.back_url | default: '/services/' %}
{% include page-hero.html
  back_url=hero_back_url
  back_label="Back"
  tagline="true"
  tag_style="anchor"
  cta_mode="none"
%}

<div class="c-container">
  <article class="c-article">
    <div class="c-article__body">
      {{ content }}
    </div>

    {% include toc.html %}
  </article>
</div>

{% if page.collapse_questions %}
<!-- Must precede toc.js: collapse.js reparents the h3s the TOC is built from. -->
<!-- 2026-11-11: Removed inline style tag_style="anchor", handled via CSS class -->
<script src="/assets/js/collapse.js" defer></script>
{% endif %}
<script src="/assets/js/toc.js" defer></script>
<script>
  const bar = document.getElementById('progress-bar');
  window.addEventListener('scroll', () => {
    const scrolled = window.scrollY;
    const total = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (scrolled / total * 100) + '%';
  });
</script>
