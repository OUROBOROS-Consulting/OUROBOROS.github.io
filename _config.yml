title: ouroborOS
# Consumed by jekyll-feed and jekyll-sitemap. Not used by default.html, which
# builds its own <meta name="description"> from page front matter.
description: >-
  Private AI engineer and AI privacy consultant. Local LLMs, AI governance, and data audits for organizations that cannot afford a leak.
author: Apostolos Stamenos
contact_url: /intake
figma_url: https://www.figma.com/@astamenos_094bc
tutoring_url: https://www.wyzant.com/refer/tutor/86925781/?utm_source=TREF&utm_campaign=iphone&utm_content=tutorapp&utm_medium=share
instagram_url: https://www.instagram.com/astamenos5/
github_url: https://github.com/OUROBOROS-Consulting
linkedin_url: https://www.linkedin.com/in/astamenos
substack_url: https://ouroborosconsult.substack.com
url: "https://ouroborosconsulting.org"

collections:
  services:
    output: true
    permalink: /services/:slug/
  resources:
    output: true
    permalink: /resources/:slug/
  case_studies:
    output: true
    permalink: /work/:slug/

# build settings
# "scripts" is listed explicitly: fetch_news.py is a build-time tool, not site
# content. The pre-existing "script" entry already excluded it by prefix match,
# which is a coincidence, not an intention.
exclude: ["script", "scripts", "vendor", "bower.json", "Gemfile", "Gemfile.lock", "Rakefile", "readme.md", "README.md", "CLAUDE.md", "DESIGN.md", "package.json", "package-lock.json", "node_modules", "docs",
  "assets/files/PSA/PsychLiteracy/DSM.pdf", "_case_studies/sanctuary.md.bak",
  "_resources/scholarly.md.bak", "_resources/survival.md.bak"]
markdown: kramdown

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    custom_inline: ["<code>", "</code>"]
    custom_block: ["<pre>", "</pre>"]

plugins:
  - jekyll-feed
  - jekyll-sitemap
