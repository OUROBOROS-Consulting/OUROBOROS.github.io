- title: Innovation
  tag: Technology
  icon: ph-fill ph-microscope
  description: >
    The best solutions aren't found in manuals. They are designed and tailored to the problems at hand. Whether bridging service continuity during a federal system migration or prototyping a data platform under deadline, I've learned to build what the situation requires, not what the playbook allows.
  reference:
  link: "#"

- title: Reason
  tag: Science
  icon: ph-fill ph-scales
  description: >
    Emotions are data, but they aren't evidence. I trained in biostatistics because I believe rigorous thinking is one of the most compassionate things you can offer someone in crisis — especially in public health, where the stakes are real people's lives. Clear reasoning is a form of respect.
  reference:
  link: "#"

- title: Efficiency
  tag: Technology
  icon: ph-fill ph-ruler
  description: >
    Wasted effort compounds. I automate what can be automated, document what needs to persist, and focus human attention where it belongs.
    At HHS, this meant ensuring critical data pipelines kept flowing even as organizations changed hands. Good systems shouldn't need heroes.
  reference:
  link: "#"

- title: Autonomy
  tag: Personal
  icon: ph-fill ph-hand-fist
  description: >
    I believe people have the right to make informed decisions about their own lives — especially when institutions make that difficult.
    Autonomy isn't just a personal value; it's a design principle.
    Systems that erode it harm the people they claim to serve.
  reference:
  link: "#"

- title: Integrity
  tag: Ethics
  icon: ph-fill ph-fingerprint
  description: >
    Integrity is what you do when no one is watching — and what you're willing to put on record when they are.
    I've worked in environments where accountability was optional and silence was rewarded. I chose differently. That choice cost something, and I'd make it again.
  reference:
  link: "#"

- title: Transparency
  tag: Ethics
  icon: ph-fill ph-eye
  description: >
    Opacity protects bad systems. Transparency is how individuals protect themselves — and how communities hold institutions accountable.
    I document carefully, communicate openly, and believe that making things legible is both a technical skill and a civic responsibility.
  reference:
  link: "#"

- title: Security
  tag: Technology
  icon: ph-fill ph-key
  description: >
    Security means different things in different contexts: FedRAMP compliance, data privacy, personal safety. But the underlying principle is the same — people deserve to be protected, not just from external threats, but from systems that are supposed to help them.
  reference:
  link: "#"

- title: Kindness
  tag: Personal
  icon: ph-fill ph-heart
  description: >
    Kindness is not weakness — it requires discipline, especially when trust has been broken. In work with survivors, kindness means meeting people where they are and honoring what they've endured.
    It's the foundation that makes everything else possible.
  reference:
  link: "#"
