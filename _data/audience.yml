- title: Organizations with Sensitive Data
  icon:   ph-fill ph-briefcase
  description: >
    Most teams cannot say where their data goes after it enters an AI tool. Map the data flow, choose a private setup, and set clear rules before confidential information moves.

- title: Teams Accountable for Reporting
  icon:   ph-fill ph-user
  description: >
    Bad numbers can reach leadership, Congress, or the public before anyone catches them. Audit data and add checks that flag impossible values before they go out.
