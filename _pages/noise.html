<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Hero Section - Anchored Text</title>
    <style>
      :root {
        --bg-dark: #191B1C;
        --gold-accent: #DDCBA3;
        --metal-light: #E0E0E0;
        /* Dynamic cursor coordinates initialized to center */
        --mouse-x: 0.5;
        --mouse-y: 0.5;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--p-color-ink-palantir-dark);
        font-family: "Syne", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
      }

      /* Hero Container */
      .hero-section {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-dark);
        overflow: hidden;
      }

      /* Generated Abstract Texture Layer (Only this layer morphs) */
      .texture-overlay {
        position: absolute;
        top: -10%;
        left: -10%;
        width: 120%;
        height: 120%;
        z-index: 1;
        opacity: 0.75;
        will-change: transform;

        /* Base gradients that shift lighting vectors via cursor coordinates */
        background:
          radial-gradient(circle at calc(var(--mouse-x) * 100%) calc(var(--mouse-y) * 100%), rgba(224, 224, 224, 0.18) 0%, transparent 45%),
          radial-gradient(circle at calc((1 - var(--mouse-x)) * 100%) calc((1 - var(--mouse-y)) * 100%), rgba(221, 203, 163, 0.22) 0%, transparent 55%),
          linear-gradient(135deg, var(--bg-dark) 0%, #242729 100%);

        /* Subtle organic transform warp alongside the SVG matrix shift */
        transform:
          translate(calc((var(--mouse-x) - 0.5) * -30px), calc((var(--mouse-y) - 0.5) * -30px)) scale(1.05);

        filter: url(#futuristic-displacement);
        pointer-events: none;
      }

      /* Hero Typography and Content Layer (Completely Anchored) */
      .hero-content {
        position: relative;
        z-index: 2;
        text-align: center;
        max-width: 800px;
        padding: 0 20px;
        /* Removed parallax transform rules to keep text completely still */
      }

      .hero-title {
        font-family:  'Manufacturing Consent', serif;
        font-size: 3.5rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        color: var(--metal-light);
        margin-bottom: 20px;
        text-shadow: 0 4px 20px rgba(25, 27, 28, 0.9);
      }

      .hero-title span {
        color: var(--gold-accent);
        display: block;
        font-size: 1.2rem;
        letter-spacing: 0.4em;
        margin-bottom: 10px;
      }

      .hero-subtitle {
        font-size: 1.1rem;
        color: rgba(224, 224, 224, 0.7);
        line-height: 1.6;
        margin-bottom: 40px;
      }

      .hero-btn {
        display: inline-block;
        padding: 14px 32px;
        background-color: transparent;
        color: var(--gold-accent);
        border: 1px solid var(--gold-accent);
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        text-decoration: none;
        transition: background-color 0.3s, color 0.3s, box-shadow 0.3s;
        cursor: pointer;
      }

      .hero-btn:hover {
        background-color: var(--gold-accent);
        color: var(--bg-dark);
        box-shadow: 0 0 25px rgba(221, 203, 163, 0.4);
      }
    </style>
  </head>

  <body>

    <section class="hero-section" id="hero">
      <!-- Fluid background layer -->
      <div class="texture-overlay"></div>

      <!-- Stationary interface layer -->
      <div class="hero-content">
        <h1 class="hero-title">
          <span>Project Initiative</span>
          Evolving Reality
        </h1>
        <p class="hero-subtitle">
          Deploying high-fidelity, interactive fractal displacement landscapes directly into the web
          runtime environment.
        </p>
        <a href="#" class="hero-btn">Initialize System</a>
      </div>
    </section>

    <!-- SVG Filter engine -->
    <svg style="position: absolute; width: 0; height: 0;" aria-hidden="true" version="1.1"
      xmlns="http://w3.org">
      <defs>
        <filter id="futuristic-displacement">
          <feTurbulence type="fractalNoise" baseFrequency="0.14" numOctaves="1" result="noise" />
          <feDisplacementMap id="displacement-map" in="SourceGraphic" in2="noise" scale="120"
            xChannelSelector="R" yChannelSelector="G" />
            
        </filter>

      </defs>
    </svg>

    <script src="{{'/assets/js/noise.js'}}"></script>
  </body>

</html>
