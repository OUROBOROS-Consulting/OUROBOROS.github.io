<!-- ── Footer Organism ─────────────────────────────────────────────────────── -->
<footer class="c-footer">
  <!-- 1. Add a background image layer -->
  <div class="c-footer__bg"></div>
  <div class="c-footer__scrim" aria-hidden="true"></div>

  <!-- 2. Keep the logo, but make it a decorative oversized mark -->
  <!-- <a class="c-footer__logo" href="{{ '/' | relative_url }}" aria-label="ouroborOS home">
        <img src="{{ '/assets/images/logo.svg' | relative_url }}" alt="" class="c-footer__logo-mark"
          width="1000" height="1000">
      </a> -->

  <div class="c-footer__inner">
    <!-- availability unchanged -->
    <div class="c-footer__availability">
      {% include hours.html %}
    </div>
    <!-- brand block unchanged -->
    <div class="c-footer__brand">
      <div class="c-footer__credits">
        <p class="c-footer__copy">
          Site design and development by <a href="{{ site.github_url }}" target="_blank"
            rel="noopener noreferrer">{{ site.author }}</a>.
        </p>
        <p class="c-footer__copy">
          &copy; {{ 'now' | date: "%Y" }} {{ site.author }}. All rights reserved.
        </p>
      </div>

      <nav class="c-footer__links" aria-label="Social links">
        <a href="{{ site.figma_url }}" target="_blank" rel="noopener noreferrer"
          class="c-footer__social-link" aria-label="Figma">
          <i class="ph-fill ph-figma-logo" aria-hidden="true"></i>
        </a>
        <a href="{{ site.github_url }}" target="_blank" rel="noopener noreferrer"
          class="c-footer__social-link" aria-label="GitHub">
          <i class="ph-fill ph-github-logo" aria-hidden="true"></i>
        </a>
        <a href="{{ site.linkedin_url }}" target="_blank" rel="noopener noreferrer"
          class="c-footer__social-link" aria-label="LinkedIn">
          <i class="ph-fill ph-linkedin-logo" aria-hidden="true"></i>
        </a>
        <a href="{{ site.instagram_url }}" target="_blank" rel="noopener noreferrer"
          class="c-footer__social-link" aria-label="Instagram">
          <i class="ph-fill ph-instagram-logo" aria-hidden="true"></i>
        </a>
        <a href="{{ site.threads_url }}" target="_blank" rel="noopener noreferrer"
          class="c-footer__social-link" aria-label="Threads">
          <i class="ph-fill ph-threads-logo" aria-hidden="true"></i>
        </a>
        <a href="{{ site.x_url }}" target="_blank" rel="noopener noreferrer"
          class="c-footer__social-link" aria-label="X">
          <i class="ph-fill ph-x-logo" aria-hidden="true"></i>
        </a>
        <a href="{{ site.substack_url }}" target="_blank" rel="noopener noreferrer"
          class="c-footer__social-link" aria-label="ouroborOS on Substack">
          <i class="ph-fill ph-bookmark" aria-hidden="true"></i>
        </a>
        <a href="{{ '/intake' | relative_url }}" class="c-footer__social-link" aria-label="Contact">
          <i class="ph-fill ph-envelope" aria-hidden="true"></i>
        </a>
      </nav>

      <nav class="c-disclaimer-bar__links" aria-label="Legal links">
        <a href="{{ '/disclaimer/' | relative_url }}" class="c-disclaimer-bar__link">Disclaimer</a>
        &middot;
        <a href="{{ '/privacy/' | relative_url }}" class="c-disclaimer-bar__link">Privacy</a>
        &middot;
        <a href="{{ '/accessibility/' | relative_url }}"
          class="c-disclaimer-bar__link">Accessibility</a>
        &middot;
        <a href="{{ '/llm-disclosure/' | relative_url }}" class="c-disclaimer-bar__link">LLM
          Disclosure</a>
        &middot;
        <a href="{{ '/sitemap.xml' | relative_url }}" class="c-disclaimer-bar__link" title="Full site map">
          Sitemap
        </a>
      </nav>
    </div>
  </div>
</footer>
