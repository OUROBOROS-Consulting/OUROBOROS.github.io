<aside id="rail" class="rail" aria-label="Contact and announcements" data-spine>
  <!-- Three lanes, left to right: the snake, then the beads, then the icons.
       The snake is a ::before on .rail-nav (NOT on this element) so it stretches
       to the height of the bead run — add a fourth rail-group and it grows on
       its own. See _sass/design/_sidebar-rail.scss for the lane budget; all
       three lanes share 3.5rem and there is ~3px of slack.

       Beads are invisible at rest and fade in when the cursor is anywhere on
       the strip. The current page's bead stays lit regardless.

       data-spine and data-spine-node are inert as far as CSS is concerned — the
       procedural golden thread was retired 2026-08-11 and .spine is
       display:none. They stay because assets/js/spine.js still reads them, and
       because .spine-tick is a real child of each data-spine-node row.

       Each row reveals its OWN label on hover; the rail itself never widens. -->
  <nav class="rail-nav">
    <div class="rail-group{% if page.url contains '/intake' %} rail-group--active{% endif %}" data-spine-node>
      <span class="spine-tick" aria-hidden="true"></span>
      <a class="rail-item" href="{{ '/intake' | relative_url }}" title="Contact"{% if page.url contains '/intake' %} aria-current="page"{% endif %}>
        <span class="rail-ic"><i class="fas fa-envelope" aria-hidden="true"></i></span>
        <span class="rail-tx">Contact</span>
      </a>
    </div>
    <div class="rail-group{% if page.url contains '/announcements' %} rail-group--active{% endif %}" data-spine-node>
      <span class="spine-tick" aria-hidden="true"></span>
      <a class="rail-item" href="{{ '/announcements' | relative_url }}" title="Announcements"{% if page.url contains '/announcements' %} aria-current="page"{% endif %}>
        <span class="rail-ic"><i class="fas fa-newspaper" aria-hidden="true"></i></span>
        <span class="rail-tx">Announcements</span>
      </a>
    </div>
    <div class="rail-group" data-spine-node>
      <span class="spine-tick" aria-hidden="true"></span>
      <button type="button" id="theme-toggle" class="rail-item rail-item--button" title="Toggle theme" aria-label="Dark theme. Activate to switch to light theme.">
        <span class="rail-ic"><i class="fas fa-moon" aria-hidden="true"></i></span>
        <span class="rail-tx">Dark</span>
      </button>
    </div>
  </nav>
</aside>
