<!-- ── Nav Organism ───────────────────────────────────────────────────────── -->
<header aria-label="Main navigation" class="c-nav">
  <nav class="c-nav__container" aria-label="Primary">
    <!-- Logo -->
    <a class="c-nav__logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo.svg' | relative_url }}" alt="ouroborOS" class="c-nav__logo-mark" width="1000" height="1000">
    </a>

    <!-- Page links -->
    <div class="c-nav__links" id="primary-nav-links">
      {% for item in site.data.nav %}
      <div class="c-nav__dropdown">
        {% if item.children %}
        <div class="c-nav__dropdown-row">
          <a href="{{ item.url | relative_url }}" class="c-nav__link">
            <i class="ph-fill {{ item.icon }}" aria-hidden="true"></i>
            {{ item.title }}
          </a>
          <button type="button" class="c-nav__accordion-btn" aria-expanded="false"
            aria-controls="nav-dropdown-menu-{{ forloop.index }}" aria-label="Toggle {{ item.title }} submenu">
            <i class="ph-fill ph-chevron-down" aria-hidden="true"></i>
          </button>
        </div>
        <div class="c-nav__dropdown-menu" id="nav-dropdown-menu-{{ forloop.index }}">
          {% for child in item.children %}
          <a href="{{ child.url | relative_url }}" class="c-nav__dropdown-link">{{ child.title }}</a>
          {% endfor %}
        </div>
        {% else %}
        <a href="{{ item.url | relative_url }}" class="c-nav__link">
          <i class="ph-fill {{ item.icon }}" aria-hidden="true"></i>
          {{ item.title }}
        </a>
        {% endif %}
      </div>
      {% endfor %}
    </div>

    <!-- Actions: Search, Contact, News, Theme -->
    <div class="c-nav__actions">
      <form id="nav-search-wrap" class="c-nav__search-wrap" action="{{ '/search/' | relative_url }}" method="get" role="search">
        <input id="nav-search-input" class="c-nav__search-input" type="search" name="q" aria-label="Search site" placeholder="Search…" autocomplete="off" tabindex="-1">
        <button type="submit" class="c-nav__search-submit" aria-label="Submit search" tabindex="-1">
          <i class="ph-fill ph-arrow-right" aria-hidden="true"></i>
        </button>
        <button type="button" class="c-nav__search-toggle" aria-label="Open search" aria-expanded="false"
          aria-controls="nav-search-input">
          <i class="ph-fill ph-magnifying-glass" aria-hidden="true"></i>
        </button>
      </form>

      <a href="{{ '/intake' | relative_url }}" class="c-nav__action-item" aria-label="Contact" title="Contact">
        <i class="ph ph-fill ph-envelope" aria-hidden="true"></i>
      </a>

      <a href="{{ '/announcements' | relative_url }}" class="c-nav__action-item" aria-label="News and announcements" title="News and announcements">
        <i class="ph ph-fill ph-megaphone" aria-hidden="true"></i>
      </a>

      <button type="button" id="theme-toggle" class="c-nav__action-item c-nav__theme-btn" title="Toggle theme" aria-label="Toggle theme">
        <i class="ph ph-fill ph-moon" aria-hidden="true"></i>
      </button>
    </div>

    <!-- Mobile menu toggle -->
    <button type="button" class="c-nav__hamburger" aria-label="Open navigation menu" aria-expanded="false"
      aria-controls="primary-nav-links">
      <i class="ph-fill ph-list" aria-hidden="true"></i>
    </button>
  </nav>
  <div id="progress-bar-top" class="progress-bar"></div>
  <div id="progress-bar-bottom" class="progress-bar"></div>
</header>
